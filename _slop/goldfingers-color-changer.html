<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldfinger's Logo Colorways</title>
<link id="favicon" rel="icon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@1,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#17140f;--mute:#6f6a62;--line:#dedad2;--panel:#f3f1ec; --accent:rgba(0, 0, 0, .05); --on-accent:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--ink:#f1eee6;--mute:#9a958a;--line:#2f2c27;--panel:#1b1917;--accent:#e0472f}}
:root[data-theme="dark"]{--bg:#121110;--ink:#f1eee6;--mute:#9a958a;--line:#2f2c27;--panel:#1b1917;--accent:#e0472f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Work Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#9c1303;color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px max(clamp(16px,3vw,40px),calc((100% - 1440px)/2))}
.brand{font:italic 700 24px/1 "Playfair Display SC",Georgia,serif;margin-right:auto;letter-spacing:-.015em;text-transform:uppercase}
.seg{display:inline-flex;gap:4px;border:1px solid var(--ink);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 20px;border-radius:999px;font-weight:500;transition:background .15s}
.seg button:not([aria-pressed="true"]):hover{background:var(--panel)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:none;border-radius:999px;padding:9px 18px;font-weight:500;transition:background .15s,color .15s}
.btn:hover{background:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.6;cursor:progress}
.ctl{display:flex;flex-wrap:nowrap;align-items:center;gap:10px}
.bar .btn,.bar .seg button{white-space:nowrap}
.bar .seg,.bar .btn{border-color:#fff;color:#fff}
.bar .seg button:not([aria-pressed="true"]):hover,.bar .btn:hover{background:rgba(255,255,255,.14)}
.bar .seg button[aria-pressed="true"]{background:#fff;color:#9c1303}
main{padding:0 max(clamp(16px,3vw,40px),calc((100% - 1440px)/2)) 64px}
.rule{border:0;border-top:1px solid var(--line);margin:56px 0 28px}
.more{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:28px}
.more p{margin:0;font-size:18px;font-weight:500}
.custom{display:grid;grid-template-columns:50% minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:stretch;margin:28px 0 36px;padding:clamp(16px,3vw,32px);background:var(--panel);border-radius:6px}
.custom .sw{align-self:start}
.custom>div{display:flex;flex-direction:column;min-width:0}
.custom p{margin:auto 0 22px;color:var(--mute);max-width:46ch}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px 20px;margin-bottom:22px;max-width:620px}
.field{min-width:0}
.field label{display:block;font-weight:500;margin-bottom:6px}
.pick{display:flex;gap:8px}
.pick input[type=color]{flex:none;width:42px;height:42px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.pick input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.pick input[type=color]::-webkit-color-swatch,.pick input[type=color]::-moz-color-swatch{border:0;border-radius:3px}
.hexwrap{position:relative;flex:1 1 0;min-width:0}
.die{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:28px;height:28px;border:0;background:none;border-radius:4px;color:var(--mute)}
.die:hover{color:var(--ink);background:var(--panel)}
.die svg{width:18px;height:18px}
.custom .row{margin-bottom:18px}
.pick input[type=text]{width:100%;min-width:0;height:42px;padding:0 38px 0 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 15px "Work Sans",sans-serif;font-variant-numeric:tabular-nums;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px 24px}
.sw{position:relative;cursor:pointer;display:block;width:100%;aspect-ratio:1;padding:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.dli{opacity:.4;transition:opacity .15s}
.sw:hover .dli,.sw:focus-visible .dli{opacity:1}
.sw>svg{display:block;width:100%;height:100%}
.dli{z-index:1;position:absolute;right:clamp(10px,1.6vw,18px);bottom:clamp(10px,1.6vw,18px);width:clamp(22px,2.6vw,30px);height:clamp(22px,2.6vw,30px);pointer-events:none}
.dli svg{display:block;width:100%;height:100%}
.card{container-type:inline-size}
.meta{display:block;margin-top:8px}
.nm{display:block;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hex{display:flex;flex-wrap:nowrap;white-space:nowrap;gap:2px 14px;margin-top:4px;color:var(--mute);font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums}
@container (min-width:420px){.meta{display:flex;align-items:center;justify-content:space-between;gap:24px}.nm{flex:1 1 auto;min-width:0}.hex{flex:none;margin-top:0}}
@container (max-width:200px){.hex{font-size:11.5px;gap:8px}.hex i{margin-right:4px}}
.hex i{display:inline-block;width:10px;height:10px;border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
.note{color:var(--mute);font-size:13px;margin:36px 0 0}
@media (max-width:960px){.ctl{width:100%}}
@media (max-width:560px){.x{display:none}.seg button{padding:6px 12px}.btn{padding:8px 12px}}
@media (max-width:380px){.ctl{gap:6px}.seg button{padding:6px 9px}.btn{padding:8px 9px}}
@media (max-width:760px){.custom{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}.brand{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const cols=c=>st.swap?{bg:c.fg,fg:c.bg}:{bg:c.bg,fg:c.fg};

/* artwork */
const svgStr=(style,bg,fg,size)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="${size}" height="${size}"><rect width="150" height="150" fill="${bg}"/><g fill="${fg}">`+(style==="solid"?`<g transform="translate(159.52 0)"><path d="${D_S1}"/><path d="${D_S2}"/></g>`:`<path d="${D_OUT}"/>`)+`</g></svg>`;
const inline=(bg,fg)=>`<svg viewBox="0 0 150 150" aria-hidden="true"><rect width="150" height="150" fill="${bg}"/><use href="#${st.style}" fill="${fg}"/></svg>`;
function png(style,bg,fg){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=1600;c.getContext("2d").drawImage(im,0,0,1600,1600);c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/png")};im.onerror=rej;im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr(style,bg,fg,1600))})}
const fname=(name,bg,fg)=>`Goldfingers-Vintage-Logo-${st.style==="solid"?"Solid":"Outlined"}-${slug(name)}-${bg.slice(1).toUpperCase()}-${fg.slice(1).toUpperCase()}.png`;

/* saving: viewer-granted download when hosted, plain download otherwise */
let dl=null;
(async()=>{try{if(window.claude&&claude.use)dl=await claude.use("downloads")}catch(e){}})();
async function save(name,blob){
  if(dl){try{await dl.save({filename:name,data:blob})}catch(e){}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* store-only ZIP */
const T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=T[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0,cs=0;
  for(const f of files){
    const n=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,n.length,true);
    parts.push(h,n,f.data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);
    cen.push(c,n);cs+=46+n.length;off+=30+n.length+sz;
  }
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type:"application/zip"});
}

/* render */
let extra=[];
const newExtra=()=>Array.from({length:6},(_,i)=>({name:"Random No. "+(i+1),...randPair()}));
function randColor(other){for(let n=0;n<200;n++){const c=hsl(Math.random()*360,25+Math.random()*70,12+Math.random()*76);if(contrast(c,other)>=3)return c}return randPair().bg}
const all=()=>[...PRE,...extra];
function tile(c,i,num){const k=cols(c);return`<article class="card"><button class="sw" data-i="${i}" aria-label="Download ${c.name} as PNG">${inline(k.bg,k.fg)}<span class="dli" style="color:${k.fg}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></span></button><div class="meta"><span class="nm">${num?num+". ":""}${c.name}</span><span class="hex"><span title="Background"><i style="background:${k.bg}"></i>${up(k.bg)}</span><span title="Logo"><i style="background:${k.fg}"></i>${up(k.fg)}</span></span></div></article>`}
function renderGrid(){
  $("grid").innerHTML=PRE.map((c,i)=>tile(c,i,i+1)).join("");
  $("grid2").innerHTML=extra.map((c,i)=>tile(c,PRE.length+i)).join("");
}
function renderCustom(){
  $("prev").innerHTML=`<rect width="150" height="150" fill="${custom.bg}"/><use href="#${st.style}" fill="${custom.fg}"/>`;$("dliC").style.color=custom.fg;
  $("favicon").href="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr(st.style,custom.bg,custom.fg,64));
  $("cBg").value=custom.bg;$("cFg").value=custom.fg;
  if(document.activeElement!==$("cBgT"))$("cBgT").value=up(custom.bg);
  if(document.activeElement!==$("cFgT"))$("cFgT").value=up(custom.fg);
}
function renderToggle(){
  $("bSolid").setAttribute("aria-pressed",st.style==="solid");
  $("bOutline").setAttribute("aria-pressed",st.style==="outline");
}
function renderAll(){renderToggle();renderCustom();renderGrid()}

/* events */
$("bSolid").onclick=()=>{st.style="solid";renderAll()};
$("bOutline").onclick=()=>{st.style="outline";renderAll()};
$("bSwap").onclick=()=>{st.swap=!st.swap;[custom.bg,custom.fg]=[custom.fg,custom.bg];renderAll()};
$("bRand").onclick=()=>{Object.assign(custom,randPair());renderCustom()};
const hexOk=v=>/^#[0-9a-f]{6}$/i.test(v);
function bindColor(pick,txt,key){
  $(pick).oninput=e=>{custom[key]=e.target.value;renderCustom()};
  $(txt).oninput=e=>{let v=e.target.value.trim();if(v&&v[0]!=="#")v="#"+v;if(hexOk(v)){custom[key]=v.toLowerCase();renderCustom()}};
  $(txt).onblur=()=>{$(txt).value=up(custom[key])};
}
bindColor("cBg","cBgT","bg");bindColor("cFg","cFgT","fg");
$("prevBtn").onclick=async()=>save(fname("Custom",custom.bg,custom.fg),await png(st.style,custom.bg,custom.fg));
const tileClick=async e=>{
  const b=e.target.closest("[data-i]");if(!b)return;
  const c=all()[+b.dataset.i],k=cols(c);
  save(fname(c.name,k.bg,k.fg),await png(st.style,k.bg,k.fg));
};
$("grid").onclick=$("grid2").onclick=tileClick;
$("bMore").onclick=()=>{extra=newExtra();renderGrid()};
$("dBg").onclick=()=>{custom.bg=randColor(custom.fg);renderCustom()};
$("dFg").onclick=()=>{custom.fg=randColor(custom.bg);renderCustom()};
$("bZip").onclick=async()=>{
  const btn=$("bZip"),label=btn.innerHTML;btn.style.minWidth=btn.offsetWidth+"px";btn.disabled=true;
  try{
    const items=[{name:"custom",bg:custom.bg,fg:custom.fg},...all().map(c=>({name:c.name,...cols(c)}))];
    const files=[];
    for(let i=0;i<items.length;i++){
      btn.textContent=`${i+1} / ${items.length}`;
      const it=items[i],b=await png(st.style,it.bg,it.fg);
      files.push({name:fname(it.name,it.bg,it.fg),data:new Uint8Array(await b.arrayBuffer())});
      await new Promise(r=>setTimeout(r));
    }
    await save(`Goldfingers-Vintage-Logo-${st.style==="solid"?"Solid":"Outlined"}-colorways.zip`,zip(files));
  }catch(e){console.error(e)}
  btn.innerHTML=label;btn.style.minWidth="";btn.disabled=false;
};

extra=newExtra();
renderAll();
</script>
</body>
</html>
